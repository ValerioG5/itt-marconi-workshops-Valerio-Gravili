# -----------------------------------------------------------------------------
# services.yaml — manifest read by the acceptance suite
# -----------------------------------------------------------------------------
# Declares the services implemented in this repository. The suite:
#   1. launches each process with `command`, from working directory `cwd`;
#   2. injects PORT and the *_SERVICE_URL environment variables;
#   3. waits until GET {base_url}/health returns 200;
#   4. runs the tests, then terminates the process.
#
# Every service reads PORT and the *_SERVICE_URL values from the environment
# via its own app/config.py — no URL or port is hard-coded anywhere in the
# application code (see .kiro/steering/platform-standards.md).
# -----------------------------------------------------------------------------

services:
  # ------------------------------- mandatory -------------------------------
  user:
    cwd: services/user-service
    command: python -m app
    health_path: /health

  event:
    cwd: services/event-service
    command: python -m app
    health_path: /health

  registration:
    cwd: services/registration-service
    command: python -m app
    health_path: /health

  # ------------------------------- optional --------------------------------
  # Not implemented: their acceptance tests are skipped, not failed.
  #
  # feedback:
  #   cwd: services/feedback-service
  #   command: python -m app
  #   health_path: /health
  #
  # notification:
  #   cwd: services/notification-service
  #   command: python -m app
  #   health_path: /health
